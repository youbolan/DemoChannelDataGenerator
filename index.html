<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Channel Data Generator</title>
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script defer src="js/utils.js"></script>
  <script defer src="js/defaultData.js"></script>
  <script defer src="js/fileIO.js"></script>
  <script defer src="js/validators.js"></script>
  <script defer src="js/dateResolver.js"></script>
  <script defer src="js/addressEngine.js"></script>
  <script defer src="js/pricingEngine.js"></script>
  <script defer src="js/orderGenerator.js"></script>
  <script defer src="js/shipmentProcessor.js"></script>
  <script defer src="js/app.js"></script>
</head>

<body>
  <main class="page-shell">
    <header class="hero">
      <p class="eyebrow">Browser-Only Workflow</p>
      <h1>Demo S/O and ShipmentData Generator</h1>
      <p class="hero-copy">
        Generate sales-order demo data and shipment deliverables entirely in the browser.
      </p>
      <p class="app-version">Version: <span id="version-display">local</span></p>
    </header>

    <section class="app-section" aria-labelledby="sales-order-heading">
      <h2 id="sales-order-heading">Section 1: Sales Order Generation</h2>
      <form id="sales-order-form" novalidate>
        <fieldset>
          <legend>Sales Order Inputs</legend>
          <div class="form-row">
            <label class="field">
              <span>Customer Source File</span>
              <input id="customer-file" type="file" accept=".csv,.xlsx">
            </label>
            <label class="field">
              <span>Customer-Channel Mapping File</span>
              <input id="mapping-file" type="file" accept=".csv,.xlsx">
            </label>
            <label class="field">
              <span>SKU Source File</span>
              <input id="sku-file" type="file" accept=".csv,.xlsx">
            </label>
          </div>
          <div class="form-row">
            <label class="field">
              <span>Order Date</span>
              <input id="order-date" type="date">
            </label>
            <label class="field">
              <span>Shipment Date</span>
              <input id="shipment-date" type="date">
            </label>
          </div>
          <div class="form-row align-end">
            <label class="field" style="flex: 1;">
              <span>Sales Order Output Format</span>
              <select id="order-output-format">
                <option value="csv">CSV</option>
                <option value="xlsx">XLSX</option>
              </select>
            </label>
            <div class="inline-buttons" style="flex: 2;">
              <button id="generate-btn" type="submit" disabled>Generate Sales Orders</button>
              <button id="generate-default-btn" type="button">Generate from default data</button>
            </div>
          </div>
        </fieldset>
      </form>
      <div id="order-results" class="results-panel" role="status" aria-live="polite" tabindex="-1"></div>
    </section>

    <section class="app-section" aria-labelledby="shipment-heading">
      <h2 id="shipment-heading">Section 2: Shipment Processing</h2>
      <form id="shipment-form" novalidate>
        <fieldset>
          <legend>Shipment Inputs</legend>
          <div class="field-grid">
            <label class="field">
              <span>Master Shipment File</span>
              <input id="shipment-master-file" type="file" accept=".csv,.xlsx">
            </label>
            <label class="field">
              <span>Shipment Output Format</span>
              <select id="shipment-output-format">
                <option value="xlsx">XLSX</option>
                <option value="csv">CSV</option>
              </select>
            </label>
          </div>
          <div class="button-row">
            <button id="process-btn" type="submit" disabled>Process Shipments</button>
          </div>
        </fieldset>
      </form>
      <div id="shipment-results" class="results-panel" role="status" aria-live="polite" tabindex="-1"></div>
    </section>
  </main>
</body>

</html>
